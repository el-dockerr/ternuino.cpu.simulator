# Ternuino gate-level cost model
#
#   !!! PLACEHOLDER VALUES - NOT MEASURED DATA !!!
#
# These mirror the compiled-in defaults in src/gates/cost.c. Replace them with
# real T-CMOS numbers (e.g. from the UNIST 28-nm T-CMOS work) and binary CMOS
# numbers from the same technology node, then set `placeholder no`.
#
# Load with:  ternuino --gate-report --gate-costs config/gate_costs.cfg
#
# Columns: gate  delay_ps  energy_fj  area_um2  leakage_nw  [transistors]
#   energy_fj  = dynamic energy per FULL-swing output transition
#   leakage_nw = average static power of the cell
# Gates that are not listed keep their compiled-in values.

placeholder yes

# Energy of a ternary half-swing transition (VDD/2 step) relative to a
# full-swing (-1 <-> +1) transition.
half_swing_factor 0.5

# --- ternary (T-CMOS) ---
TIE-    0.0   0.00   0.20   0.1   2
TIE0    0.0   0.00   0.25   5.0   2
TIE+    0.0   0.00   0.20   0.1   2
STI    10.0   0.12   0.25   5.0   2
PTI     8.0   0.10   0.25   0.5   2
NTI     8.0   0.10   0.25   0.5   2
MIN    20.0   0.30   0.65   6.0   6
MAX    20.0   0.30   0.65   6.0   6

# --- binary CMOS baseline ---
TIE_LO  0.0   0.00   0.20   0.1   2
TIE_HI  0.0   0.00   0.20   0.1   2
INV     8.0   0.10   0.25   0.5   2
NAND   12.0   0.18   0.40   0.8   4
NOR    14.0   0.20   0.40   0.8   4
